name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/veerbal1/homestead:${{ steps.sha.outputs.short }}
          build-args: VERSION=${{ steps.sha.outputs.short }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run migrations (Neon, before rollout)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.0
          goose -dir ./migrations postgres "$DATABASE_URL" up

      - name: Deploy to box
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BOX_HOST: ${{ secrets.BOX_HOST }}
          BOX_USER: ${{ secrets.BOX_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 400 key.pem
          TAG=${GITHUB_SHA::7}
          ssh -i key.pem -o StrictHostKeyChecking=accept-new "$BOX_USER@$BOX_HOST" \
            "TAG=$TAG docker compose -f docker-compose.prod.yml pull && \
             TAG=$TAG docker compose -f docker-compose.prod.yml up -d"

      - name: Smoke test (readyz + version==SHA)
        env:
          BOX_HOST: ${{ secrets.BOX_HOST }}
        run: |
          SHA=${GITHUB_SHA::7}
          # retry /readyz until 200 — container needs a few seconds after up -d
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$BOX_HOST/readyz" || true)
            [ "$code" = "200" ] && break
            echo "readyz attempt $i -> $code, retrying..."
            sleep 3
          done
          [ "$code" = "200" ] || { echo "FAIL: /readyz never returned 200"; exit 1; }
          echo "readyz OK"
          # assert /version == the SHA we just deployed (proves NEW code is live)
          got=$(curl -s --max-time 5 "http://$BOX_HOST/version")
          echo "deployed SHA=$SHA, served /version=$got"
          [ "$got" = "$SHA" ] || { echo "FAIL: version mismatch (old container?)"; exit 1; }
          echo "SMOKE PASSED"
