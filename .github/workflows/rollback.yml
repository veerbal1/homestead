name: Rollback

# One-click rollback: Actions -> Rollback -> Run workflow -> enter SHA.
# Or: gh workflow run rollback.yml -f sha=<sha>
# Redeploys a previously-built image (images are SHA-tagged). No migrations —
# rollback is code-only; the DB stays put (migrations are additive).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Image SHA tag to roll back to (e.g. 6ce301a)"
        required: true

concurrency:
  group: prod
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the requested SHA to the box
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BOX_HOST: ${{ secrets.BOX_HOST }}
          BOX_USER: ${{ secrets.BOX_USER }}
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 400 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new "$BOX_USER@$BOX_HOST" \
            "TAG=$SHA docker compose -f docker-compose.prod.yml pull && \
             TAG=$SHA docker compose -f docker-compose.prod.yml up -d"

      - name: Smoke test (readyz + version==requested SHA)
        env:
          BOX_HOST: ${{ secrets.BOX_HOST }}
          SHA: ${{ inputs.sha }}
        run: |
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$BOX_HOST/readyz" || true)
            [ "$code" = "200" ] && break
            echo "readyz attempt $i -> $code, retrying..."
            sleep 3
          done
          [ "$code" = "200" ] || { echo "FAIL: /readyz never returned 200"; exit 1; }
          got=$(curl -s --max-time 5 "http://$BOX_HOST/version")
          echo "requested=$SHA served=$got"
          [ "$got" = "$SHA" ] || { echo "FAIL: version mismatch"; exit 1; }
          echo "ROLLBACK OK: now serving $got"
